<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perapi Soal Ujian - Adi Putra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <style>
        @media print {
            @page { size: A4; margin: 15mm; }
            body { background: white; color: black; -webkit-print-color-adjust: exact; }
            no-print, header, footer, .no-print { display: none !important; }
            .print-container { box-shadow: none; padding: 0 !important; margin: 0 !important; width: 100%; max-width: none; border: none; }
            
            .print-page {
                page-break-after: always;
                break-after: page;
                margin-bottom: 0 !important;
            }
            
            .q-card {
                border: 1px solid #cbd5e1;
                padding: 10px;
                display: flex;
                flex-direction: column;
                page-break-inside: avoid;
                break-inside: avoid;
            }
        }
        
        .print-page {
            margin-bottom: 32px;
            padding: 24px;
            background: white;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .q-card {
            border: 1px solid #e2e8f0;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 no-print">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white font-bold w-10 h-10 rounded-xl flex items-center justify-center text-lg shadow-md">AP</div>
                <div>
                    <h1 class="font-bold text-slate-900 leading-tight">Perapi Soal Ujian</h1>
                    <p class="text-xs text-slate-500">Oleh Adi Putra</p>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-8">
        
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-8 no-print">
            <div class="max-w-xl mx-auto text-center mb-6">
                <h2 class="text-2xl font-bold text-slate-900 mb-2">Unggah Dokumen PDF</h2>
            </div>

            <div id="dropZone" class="border-2 border-dashed border-slate-300 rounded-xl p-8 text-center cursor-pointer hover:border-indigo-500 hover:bg-indigo-50 transition bg-slate-50/50">
                <input type="file" id="pdfFile" accept="application/pdf" class="hidden">
                <div class="flex flex-col items-center pointer-events-none">
                    <svg class="w-12 h-12 text-indigo-500 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                    </svg>
                    <p class="text-base font-semibold text-slate-700 mb-1">Tarik file PDF ke sini atau klik untuk memilih</p>
                </div>
            </div>

            <div id="configSection" class="hidden mt-6 grid grid-cols-1 sm:grid-cols-2 gap-4 pt-6 border-t border-slate-100 max-w-2xl mx-auto">
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-2">Target Jumlah Soal per Halaman</label>
                    <select id="questionsPerPage" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-4 py-3 text-base font-semibold focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="5">5 Soal / Lembar</option>
                        <option value="6">6 Soal / Lembar</option>
                        <option value="7">7 Soal / Lembar</option>
                        <option value="8">8 Soal / Lembar</option>
                        <option value="9">9 Soal / Lembar</option>
                        <option value="10" selected>10 Soal / Lembar</option>
                        <option value="11">11 Soal / Lembar</option>
                        <option value="12">12 Soal / Lembar</option>
                        <option value="13">13 Soal / Lembar</option>
                        <option value="14">14 Soal / Lembar</option>
                        <option value="15">15 Soal / Lembar</option>
                    </select>
                </div>
                <div class="flex items-end">
                    <button id="printBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg transition shadow-md">
                        Cetak Sekarang
                    </button>
                </div>
            </div>

            <div id="progressContainer" class="hidden mt-6 max-w-2xl mx-auto">
                <div class="flex justify-between text-xs text-slate-600 mb-1">
                    <span id="progressText">Membaca PDF...</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="w-full bg-slate-200 rounded-full h-2 overflow-hidden">
                    <div id="progressBar" class="bg-indigo-600 h-2 w-0 transition-all duration-200"></div>
                </div>
            </div>
        </div>

        <div id="previewContainer" class="hidden print-container">
            <div id="questionsRoot"></div>
        </div>

    </main>

    <script>
        const dropZone = document.getElementById('dropZone');
        const pdfFileInput = document.getElementById('pdfFile');
        const configSection = document.getElementById('configSection');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const progressPercent = document.getElementById('progressPercent');
        const previewContainer = document.getElementById('previewContainer');
        const questionsRoot = document.getElementById('questionsRoot');
        const questionsPerPage = document.getElementById('questionsPerPage');
        const printBtn = document.getElementById('printBtn');

        let extractedItems = [];

        // Mengembalikan fitur klik dan Drag-and-Drop
        dropZone.addEventListener('click', () => pdfFileInput.click());
        
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('border-indigo-500', 'bg-indigo-50');
        });
        
        dropZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-indigo-500', 'bg-indigo-50');
        });
        
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-indigo-500', 'bg-indigo-50');
            if (e.dataTransfer.files.length) {
                pdfFileInput.files = e.dataTransfer.files;
                handleFile(e.dataTransfer.files[0]);
            }
        });

        pdfFileInput.addEventListener('change', (e) => {
            if (e.target.files.length) handleFile(e.target.files[0]);
        });

        questionsPerPage.addEventListener('change', renderQuestions);
        printBtn.addEventListener('click', () => window.print());

        async function handleFile(file) {
            if (file.type !== 'application/pdf') {
                alert('Harap unggah file PDF.'); return;
            }

            progressContainer.classList.remove('hidden');
            previewContainer.classList.add('hidden');
            configSection.classList.add('hidden');

            try {
                const arrayBuffer = await file.arrayBuffer();
                const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
                const pdfDoc = await loadingTask.promise;
                const numPages = pdfDoc.numPages;

                extractedItems = [];

                for (let i = 1; i <= numPages; i++) {
                    const page = await pdfDoc.getPage(i);
                    const textContent = await page.getTextContent();
                    
                    let textItems = textContent.items.map(item => item.str).join(' ');

                    if (textItems.trim().length > 0) {
                        extractedItems.push({ pageNumber: i, content: textItems });
                    }

                    const percent = Math.round((i / numPages) * 100);
                    progressBar.style.width = percent + '%';
                    progressPercent.textContent = percent + '%';
                    progressText.textContent = `Mengekstrak hal ${i} dari ${numPages}...`;
                }

                progressContainer.classList.add('hidden');
                configSection.classList.remove('hidden');
                previewContainer.classList.remove('hidden');
                
                renderQuestions();

            } catch (error) {
                console.error(error);
                alert('Gagal membaca PDF.');
                progressContainer.classList.add('hidden');
            }
        }

        function createCard(item, index, defaultFontSize) {
            const card = document.createElement('div');
            card.className = `q-card`;
            
            let cleanText = item.content.replace(/(banksoalu[t]?\s*)+/gi, '');
            cleanText = cleanText.replace(/\s+/g, ' ').trim();
            cleanText = cleanText.replace(/\s+([A-E]\.)\s+/g, '\n$1 ');

            card.innerHTML = `
                <div class="mb-1 flex justify-between border-b border-slate-100 pb-1">
                    <span class="bg-indigo-100 text-indigo-800 text-xs font-bold px-2 py-0.5 rounded">Soal #${index + 1}</span>
                    <span class="text-[9px] text-slate-400 no-print">Hal: ${item.pageNumber}</span>
                </div>
                <div class="q-content text-slate-800 text-left whitespace-pre-wrap" style="font-size: ${defaultFontSize}px; line-height: 1.3;">${escapeHtml(cleanText)}</div>
            `;
            return card;
        }

        function renderQuestions() {
            const limit = parseInt(questionsPerPage.value);
            questionsRoot.innerHTML = '';

            let gridColumns, defaultFontSize;

            if (limit <= 6) { gridColumns = 1; defaultFontSize = 14; }
            else if (limit <= 10) { gridColumns = 2; defaultFontSize = 12; }
            else { gridColumns = 3; defaultFontSize = 10; }

            for (let i = 0; i < extractedItems.length; i += limit) {
                const chunk = extractedItems.slice(i, i + limit);
                
                const pageWrapper = document.createElement('div');
                pageWrapper.className = 'print-page'; 
                
                const gridContainer = document.createElement('div');
                gridContainer.className = `grid gap-4 grid-cols-${gridColumns}`;
                
                chunk.forEach((item, index) => {
                    gridContainer.appendChild(createCard(item, i + index, defaultFontSize));
                });
                
                pageWrapper.appendChild(gridContainer);
                questionsRoot.appendChild(pageWrapper);
            }
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
